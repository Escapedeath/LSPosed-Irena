name: Build Irena 2.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Irena 2.0.0
        uses: actions/checkout@v6
        with:
          repository: re-zero001/LSPosed-Irena
          ref: "2.0.0"
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Keep selected version tag
        shell: bash
        run: |
          set -euo pipefail

          # Only change tags in this temporary checkout.
          # Keep JGit from selecting another release's version.
          while IFS= read -r tag; do
            if [ "$tag" != "2.0.0" ]; then
              git tag -d "$tag"
            fi
          done < <(git tag --list)

          git log -1 --format='%H %s'
          git describe --tags --exact-match HEAD

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: "false"
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13599879

      - name: Setup CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/irena-build-tools"
          "$RUNNER_TEMP/irena-build-tools/bin/python" -m pip install \
            "cmake==3.31.6" ninja

          echo "$RUNNER_TEMP/irena-build-tools/bin" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmake" ]; then
            rm -rf "$ANDROID_HOME/cmake"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-irena200-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-irena200-gradle-

      - name: Generate build signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/irena-build.jks" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias irena \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Irena Self Build" \
            -noprompt

          {
            echo "androidStoreFile=$RUNNER_TEMP/irena-build.jks"
            echo "androidStorePassword=android"
            echo "androidKeyAlias=irena"
            echo "androidKeyPassword=android"
          } >> gradle.properties

      - name: Configure build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          EOF

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          java -version
          cmake --version
          ninja --version

      - name: Build Irena modules
        run: ./gradlew :magisk-loader:zipAll --no-daemon --stacktrace

      - name: Prepare module artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          RELEASE_FILES=(magisk-loader/release/LSPosed-v2.0.0-*-Irena-release.zip)
          DEBUG_FILES=(magisk-loader/release/LSPosed-v2.0.0-*-Irena-debug.zip)

          if [ "${#RELEASE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Release ZIP"
            exit 1
          fi

          if [ "${#DEBUG_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Debug ZIP"
            exit 1
          fi

          mkdir -p artifacts/release artifacts/debug

          unzip -q "${RELEASE_FILES[0]}" -d artifacts/release
          unzip -q "${DEBUG_FILES[0]}" -d artifacts/debug

          sha256sum "${RELEASE_FILES[0]}" "${DEBUG_FILES[0]}"

      - name: Upload Release module
        uses: actions/upload-artifact@v4
        with:
          name: LSPosed-Irena-2.0.0-release
          path: artifacts/release/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Debug module
        uses: actions/upload-artifact@v4
        with:
          name: LSPosed-Irena-2.0.0-debug
          path: artifacts/debug/
          include-hidden-files: true
          if-no-files-found: error
